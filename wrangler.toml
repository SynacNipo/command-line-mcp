name = "command-line-mcp"
main = "worker.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "AgentHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentHub"]

# Local dev secrets live in .dev.vars (gitignored): PROXY_SECRET, WORKER_URL
# For production, set the secret:  wrangler secret put PROXY_SECRET
# (WORKER_URL is only used by the local agent, not the Worker itself.)
